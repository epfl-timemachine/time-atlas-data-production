name: Validate pinned RDE schemas

on:
  pull_request:
    paths:
      - 'validation/**'
      - '.github/workflows/validation.yml'
  push:
    branches:
      - main
    paths:
      - 'validation/**'
      - '.github/workflows/validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Install validation dependencies
        run: |
          python -m venv data-production-venv
          source data-production-venv/bin/activate
          python -m pip install -r validation/requirements.txt
      - name: Check the pinned bundle and run offline regression tests
        run: |
          source data-production-venv/bin/activate
          python validation/sync_schemas.py \
            --manifest validation/rde-schemas.lock.json \
            --destination validation/schemas \
            --check
          python -m unittest discover -s validation/tests -v
